<!DOCTYPE html>
<!--
  Rokit · 内置浏览器自动填充测试页面（v1.7）

  目的：
    1. 验证 BrowserManager 创建 BrowserWindow 与独立 partition 持久化登录态。
    2. 验证自动填充 input / textarea，能触发 React/Vue 等框架的 onChange。
    3. **绝不**自动点击「提交」按钮——只填 title + content，然后停止。

  用法：
    通过 IPC "browser:open" / "browser:navigate" 打开此页面（file://）。
    调用 "browser:publish" 时，BrowserTestPublisher 会先检测登录态：
       - 已登录（localStorage 里 rokit_logged_in === '1'）→ 直接填表
       - 未登录 → 等待用户在表单里输入任意用户名密码 → 模拟"登录成功"

  注意：
    此页面所有逻辑**只在页面里**运行，不向 Rokit 报告任何密码。
    Rokit 也不读取这里输入的 password 字段值。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rokit · 内置浏览器测试页面</title>
  <style>
    :root{
      --primary:#0E7C7B;--ink:#1A2226;--muted:#5A6B72;--bg:#F4F7F6;--card:#fff;--line:#E3EBEA;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:32px 24px;min-height:100vh}
    .wrap{max-width:760px;margin:0 auto}
    h1{font-size:22px;margin-bottom:8px}
    .desc{color:var(--muted);font-size:14px;margin-bottom:24px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(20,30,34,.04)}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input[type="text"],textarea,input[type="password"],input[type="search"]{
      width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:14px inherit;background:#fff;color:var(--ink);margin-bottom:14px
    }
    input:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,124,123,.18)}
    textarea{min-height:160px;resize:vertical}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .row > *{flex:1;min-width:160px}
    button{background:var(--primary);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:14px inherit;cursor:pointer;transition:background .15s}
    button:hover{background:#0A5C5B}
    button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
    button.ghost:hover{background:var(--bg)}
    .state{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
    .state.logged{background:#EAF5EA;color:#2E8B33;border:1px solid #BFE0C1}
    .state.unlogged{background:#FDF0DA;color:#7C5A0B;border:1px solid #F5D898}
    .state.unknown{background:#E2F0EF;color:#0A5C5B;border:1px solid #B8DEDC}
    .status{margin-top:14px;padding:12px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--muted)}
    .status.ok{background:#EAF5EA;color:#2E8B33;border-color:#BFE0C1}
    .status.err{background:#FCE5E1;color:#C0392B;border-color:#F4B8B0}
    .note{font-size:12px;color:var(--muted);margin-top:6px}
    [data-rokit-state="logged-in"]{display:none}
    .is-logged [data-rokit-state="logged-in"]{display:initial}
    .is-logged [data-rokit-state="logged-out"]{display:none}
    pre{background:#0E1416;color:#E6EDF0;padding:12px;border-radius:8px;font-size:12px;overflow:auto}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Rokit · 内置浏览器自动填充测试</h1>
  <div class="desc">该页面用于验证 BrowserManager / PublisherBase / 通用填充脚本。</div>

  <!-- 登录状态横幅 -->
  <div class="card" id="rokit-test-login-form">
    <div data-rokit-state="logged-out">
      <strong>模拟登录</strong>
      <p class="note">输入任意用户名密码点击「模拟登录」即可模拟已登录。Rokit 不读取这两个字段的值。</p>
      <div class="row">
        <div>
          <label for="test-username">用户名</label>
          <input type="text" name="username" id="test-username" placeholder="任意字符">
        </div>
        <div>
          <label for="test-password">密码</label>
          <input type="password" name="password" id="test-password" placeholder="任意字符">
        </div>
      </div>
      <button type="button" id="test-login-btn">模拟登录</button>
      <button type="button" class="ghost" id="test-logout-btn" style="margin-left:8px">退出登录</button>
    </div>
    <div data-rokit-state="logged-in">
      <div class="state logged">当前状态：已登录 ✓</div>
      <button type="button" class="ghost" id="test-logout-btn-2">退出登录</button>
    </div>
  </div>

  <!-- 表单：标题 + 正文 -->
  <div class="card">
    <label for="title">标题</label>
    <input type="text" name="title" id="title" placeholder="等待自动填充…">
    <label for="content">正文</label>
    <textarea name="content" id="content" placeholder="等待自动填充…"></textarea>
    <div class="note">提交按钮**永远不会被 Rokit 自动点击**——它只是用来证明「自动填充已就绪，需要你手动按」。</div>
    <button type="button" id="submit" data-test-submit>提交（手动）</button>
    <div id="status" class="status">尚未提交。</div>
  </div>

  <!-- 调试输出 -->
  <div class="card">
    <strong>调试输出</strong>
    <pre id="debug">(空)</pre>
  </div>
</div>

<script>
  // ---- 1) 登录态持久化：localStorage 与 Rokit 的 Session partition 共享同一存储域 ----
  var KEY = 'rokit_logged_in';
  function isLogged() {
    try { return localStorage.getItem(KEY) === '1'; } catch (_e) { return false; }
  }
  function setLogged(v) {
    try {
      if (v) localStorage.setItem(KEY, '1');
      else localStorage.removeItem(KEY);
    } catch (_e) {}
    applyState();
  }
  function applyState() {
    document.body.classList.toggle('is-logged', isLogged());
  }
  applyState();

  document.getElementById('test-login-btn').addEventListener('click', function () {
    setLogged(true);
    log('登录成功（localStorage 持久化）');
  });

  function bindLogout() {
    var btns = document.querySelectorAll('#test-logout-btn, #test-logout-btn-2');
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        setLogged(false);
        log('退出登录');
      });
    });
  }
  bindLogout();

  // 监听 storage 事件（同一 partition 多窗口时同步）
  window.addEventListener('storage', function (e) {
    if (e.key === KEY) applyState();
  });

  // ---- 2) 提交按钮：仅记录日志，证明不会自动触发 ----
  var submitBtn = document.getElementById('submit');
  submitBtn.addEventListener('click', function () {
    var t = document.getElementById('title').value;
    var c = document.getElementById('content').value;
    document.getElementById('status').className = 'status ok';
    document.getElementById('status').textContent = '✓ 手动提交完成（title 长度=' + t.length + ', content 长度=' + c.length + '）';
    log('用户手动点击提交');
  });

  // ---- 3) 调试输出 ----
  function log(msg) {
    var el = document.getElementById('debug');
    var prev = el.textContent === '(空)' ? '' : el.textContent + '\n';
    el.textContent = prev + '[' + new Date().toLocaleTimeString() + '] ' + msg;
  }
  // 通知外部 "页面已就绪"
  log('页面就绪，登录态=' + (isLogged() ? '已登录' : '未登录'));
</script>
</body>
</html>
