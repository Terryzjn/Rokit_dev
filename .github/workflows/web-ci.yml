name: web-ci

on:
  push:
    branches: [main, feature/**]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

# 取消同一分支/同一 PR 上仍在排队的旧运行，避免浪费 CI 分钟
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify (Astro v0.1.5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Verify no debug residue
        working-directory: web
        run: |
          # 占位：无 alert/confirm/prompt 残留
          COUNT=$(grep -rE '\b(alert|confirm|prompt)\s*\(' src --include='*.astro' --include='*.ts' --include='*.js' | wc -l)
          if [ "$COUNT" -ne "0" ]; then
            echo "::error::Found $COUNT debug residue (alert/confirm/prompt) in src/"
            grep -rE '\b(alert|confirm|prompt)\s*\(' src --include='*.astro' --include='*.ts' --include='*.js'
            exit 1
          fi
          echo "✓ No debug residue"

      - name: Verify version sync (web vs ai-launch-master)
        run: |
          # 权威源：桌面端 package.json
          PKG_VER=$(node -p "require('./ai-launch-master/package.json').version")

          # 1) web/package.json 的 version 字段需与 PKG_VER 一致
          WEB_PKG_VER=$(node -p "require('./web/package.json').version")
          if [ "$WEB_PKG_VER" != "$PKG_VER" ]; then
            echo "::error::web/package.json version mismatch: web=$WEB_PKG_VER package=$PKG_VER"
            exit 1
          fi

          # 2) 所有 const version = 'x.y.z' 必须等于 PKG_VER
          STALE=$(grep -rE "const version = ['\"][0-9]+\.[0-9]+\.[0-9]+['\"]" web/src --include='*.astro' \
            | grep -v "const version = ['\"]${PKG_VER}['\"]" || true)
          if [ -n "$STALE" ]; then
            echo "::error::const version 字面量与 PKG_VER ($PKG_VER) 不一致："
            echo "$STALE"
            exit 1
          fi

          # 3) JSON-LD softwareVersion 需与 PKG_VER 一致
          LD_VER=$(grep -oE "softwareVersion: ['\"][0-9]+\.[0-9]+\.[0-9]+['\"]" web/src/layouts/Layout.astro | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$LD_VER" != "$PKG_VER" ]; then
            echo "::error::Layout.astro JSON-LD softwareVersion mismatch: got=$LD_VER expected=$PKG_VER"
            exit 1
          fi

          echo "✓ Version sync: web/package.json=$WEB_PKG_VER, src/components=*, JSON-LD=$LD_VER (all match PKG_VER=$PKG_VER)"

      - name: Build (astro check + astro build)
        working-directory: web
        run: npm run build

      - name: Verify build artifacts
        working-directory: web
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/og-image.png || { echo "::error::dist/og-image.png missing"; exit 1; }
          test -f dist/robots.txt || { echo "::error::dist/robots.txt missing"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::dist/sitemap.xml missing"; exit 1; }
          # 桌面端实拍截图必须随 dist 复制出来（防某天仓库不慎删除）
          test -f dist/screenshots/wflow.png || { echo "::error::dist/screenshots/wflow.png missing"; exit 1; }
          test -f dist/screenshots/dashboard.png || { echo "::error::dist/screenshots/dashboard.png missing"; exit 1; }
          # 检查关键 section ID 与锚点一一对应
          for ID in pain features flow platforms shots faq download; do
            grep -q "id=\"$ID\"" dist/index.html || { echo "::error::section id=\"$ID\" missing"; exit 1; }
            grep -q "href=\"#$ID\"" dist/index.html || { echo "::error::href=\"#$ID\" missing"; exit 1; }
          done
          echo "✓ All section IDs and nav anchors present"

      - name: Verify sitemap freshness
        working-directory: web
        run: |
          # sitemap lastmod 距今超过 180 天则告警（防止遗留陈旧日期）
          TODAY=$(date -u +%s)
          LASTMOD=$(grep -oE '<lastmod>[0-9-]+</lastmod>' public/sitemap.xml | head -1 | grep -oE '[0-9-]+')
          LAST_TS=$(date -d "$LASTMOD" -u +%s)
          DAYS=$(( (TODAY - LAST_TS) / 86400 ))
          if [ "$DAYS" -gt 180 ]; then
            echo "::warning::sitemap.xml lastmod=$LASTMOD is $DAYS days old"
          else
            echo "✓ sitemap.xml lastmod=$LASTMOD ($DAYS days ago)"
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7